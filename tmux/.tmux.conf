set -g default-shell /bin/zsh

set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"
set -g mouse on

# OLED: true-black panes regardless of the client terminal's background
set -g window-style "bg=#000000"
set -g window-active-style "bg=#000000"
set -g message-style "bg=#000000,fg=#cdd6f4"
set -g mode-style "bg=#262626,fg=#cdd6f4"

# C-h/j/k/l move between panes, but pass through to (n)vim so its splits still work
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"
bind-key -n C-h if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind-key -n C-j if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind-key -n C-k if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind-key -n C-l if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'

set -s escape-time 0

# Stable SSH agent socket across reattaches (symlink maintained by ~/.ssh/rc)
set -g update-environment "DISPLAY SSH_ASKPASS SSH_AGENT_PID SSH_CONNECTION WINDOWID XAUTHORITY"
set-environment -g SSH_AUTH_SOCK $HOME/.ssh/ssh_auth_sock
set -g status-position bottom
set -g window-status-separator ""
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on

setw -g automatic-rename on
setw -g automatic-rename-format "#{pane_current_command}"
setw -g allow-rename off

set -g prefix C-Space

set -g pane-border-status top
set -g pane-border-format " #{pane_current_command} "
set -g pane-active-border-style "fg=#74c7ec"
set -g pane-border-style "fg=#262626"
set -g pane-border-lines single

bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

bind 1 if-shell "tmux select-window -t ':1'" '' "new-window -t 1"
bind 2 if-shell "tmux select-window -t ':2'" '' "new-window -t 2"
bind 3 if-shell "tmux select-window -t ':3'" '' "new-window -t 3"
bind 4 if-shell "tmux select-window -t ':4'" '' "new-window -t 4"
bind 5 if-shell "tmux select-window -t ':5'" '' "new-window -t 5"
bind 6 if-shell "tmux select-window -t ':6'" '' "new-window -t 6"
bind 7 if-shell "tmux select-window -t ':7'" '' "new-window -t 7"
bind 8 if-shell "tmux select-window -t ':8'" '' "new-window -t 8"
bind 9 if-shell "tmux select-window -t ':9'" '' "new-window -t 9"

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'erikw/tmux-powerline'
# continuum must load after anything that sets status-right (it hooks its autosave there)
set -g @plugin 'tmux-plugins/tmux-continuum'

set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'
set -g @resurrect-capture-pane-contents 'on'

if "test ! -d ~/.tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm'"
run '~/.tmux/plugins/tpm/tpm'
