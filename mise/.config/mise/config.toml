# Core tools: installed on every machine.
# Heavier language toolchains live in the opt-in `mise-langs` package (install.sh --langs).
[tools]
# runtimes many editor tools (LSPs, formatters) need
node   = "lts"
python = "latest"
uv     = "latest"

# editors & git
neovim     = "latest"
lazygit    = "latest"
lazydocker = "latest"
delta      = "latest"
gh         = "latest"

# shell & terminal
tmux   = "latest"
fzf    = "latest"
eza    = "latest"
zoxide = "latest"
atuin  = "latest"
vivid  = "latest"
"github:iffse/pay-respects" = "latest"

# AI agents
# Pinned: sandbox bootstrap depends on aoe internals; upgrade deliberately (see README)
"github:agent-of-empires/agent-of-empires" = "1.24.0"

# system & data
btop       = "latest"
dust       = "latest"
tealdeer   = "latest"
jq         = "latest"
shellcheck = "latest"

[settings]
# A repo's own version file must beat the defaults above. go is left out: go.mod's `go`
# line is a minimum, and Go switches toolchains itself when a repo needs a newer one.
idiomatic_version_file_enable_tools = ["rust", "node", "python", "ruby", "java", "dotnet"]
