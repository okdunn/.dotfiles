# Core tools: installed on every machine.
# Heavier language toolchains live in the opt-in `mise-langs` package (install.sh --langs).
[tools]
# runtimes many editor tools (LSPs, formatters) need
node   = "lts"
python = "latest"
uv     = "latest"

# editors & git
neovim     = "latest"
lazygit    = "latest"
lazydocker = "latest"
delta      = "latest"
gh         = "latest"

# shell & terminal
tmux   = "latest"
fzf    = "latest"
eza    = "latest"
zoxide = "latest"
atuin  = "latest"
"github:iffse/pay-respects" = "latest"

# system & data
btop       = "latest"
dust       = "latest"
jq         = "latest"
shellcheck = "latest"
