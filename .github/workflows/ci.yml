name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: |
          shellcheck --version
          shellcheck -x install.sh install/*.sh init-key.sh tests/*.sh ssh/.ssh/rc \
            tmux/.config/tmux-powerline/config.sh \
            tmux/.config/tmux-powerline/segments/*.sh \
            tmux/.config/tmux-powerline/themes/*.sh
      - name: zsh syntax
        run: |
          sudo apt-get install -y -qq zsh >/dev/null
          zsh -n zsh/.zshrc scripts/bin/tp

  install:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ["ubuntu:24.04", "debian:12"]
    steps:
      - uses: actions/checkout@v4
      - name: Clean-room install (${{ matrix.image }})
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: docker run --rm -v "$PWD:/src:ro" -e GITHUB_TOKEN "${{ matrix.image }}" bash /src/tests/cleanroom.sh
