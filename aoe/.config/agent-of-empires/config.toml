default_profile = ""

[acp]
allow_agent_install = false
allowed_agents = []
auto_stop_idle_secs = 3600
compaction_reminder = false
compaction_reminder_percent = 75
default_agent = "claude-code"
max_concurrent_workers = 5
node_path = ""
notice_display = "persistent"
notice_timeout_secs = 10
rate_limit_auto_resume = false
rate_limit_failover = false
rate_limit_failover_accounts = []
replay_events = 0
restrict_agents = false
show_tool_durations = true
silent_orphan_grace_secs = 120
structured_view = "auto"
wrap_tool_output = false

[auth]
persist_sessions = true

[diff]
context_lines = 3
split_view = false

[hooks]
# Install the repo's pinned toolchains before the agent starts, so they're on PATH (shims)
# inside the sandbox. A failed install mustn't block the session; the agent can retry it.
on_launch = ["mise install || true"]

[host_hooks]

[logging]
default_level = "info"
file_path = "debug.log"
keep_count = 5
max_size_mib = 50
output = "file"
rotation = "size"
show_spans = false

[logging.targets]

[sandbox]
allow_image_pull = true
auto_cleanup = true
container_runtime = "podman"
default_image = "aoe-sandbox-dotfiles:latest"
default_terminal_mode = "host"
enabled_by_default = true
environment = [
    "TERM",
    "COLORTERM",
    "FORCE_COLOR",
    "NO_COLOR",
]
extra_volumes = []
# Toolchain cache shared by every session. Overlay (:O): sessions read it but their writes are
# discarded, so one session can't tamper with what later ones run; aoe-sandbox-warm adds to it.
# Not in extra_volumes: a profile's list replaces the global one.
extra_run_args = ["-v", "aoe-mise:/opt/mise:O"]
mount_ssh = false
privileged = false
selinux_relabel = false
volume_ignores = []
volume_ignores_strategy = "anonymous"

[serve]
port = 8080

[session]
agent_status_hooks = true
auto_resume_on_restart = true
auto_stop_idle_secs = 0
click_action = "live_send"
confirm_before_quit = false
confirm_delete = false
conversation_summary = false
default_attach_mode = "live_send"
default_tool = "claude"
delete_to_trash = true
favorites_first = true
host_tab_title = true
inherit_host_environment = false
live_send_exit_chord = "C-q"
live_send_leader = "C-b"
live_send_on_view_switch = false
merge_hooks_into_selected_agent = true
mouse_capture = true
name_agent_session = false
new_session_mode = "match_default"
opencode_preassign_session_id = false
pre_trust_agent_folders = false
prevent_sleep_idle_grace_minutes = 15
prevent_sleep_when_active = false
preview_link_prefixes = []
restart_wake_message = "wake up: pick up what you were doing"
row_tag = "branch"
scratch_smart_rename = "inherit"
session_id_poller_max_threads = 50
show_activity_age = true
show_diagnostics_pane = false
show_session_colors = true
show_shortcut_bar = true
show_structured_badge = true
show_tips = true
sidebar_position = "left"
smart_rename = true
smart_rename_agent = "claude"
snooze_duration_minutes = 30
split_terminal_height_percent = 50
split_terminal_min_height = 30
split_terminal_min_width = 100
startup_recovery_wake = false
strict_hotkeys = false
tie_workdir_to_name = true
trash_retention_minutes = 43200
unread_indicator = true
yolo_mode_default = false

[session.smart_rename_model]
claude = "haiku"

[skills]
auto_propagate = false

[sound]
browser_approval_enabled = true
browser_enabled = true
browser_error_enabled = true
browser_idle_enabled = true
browser_waiting_enabled = true
enabled = false
server_enabled = true
server_error_enabled = true
server_idle_enabled = true
server_running_enabled = true
server_start_enabled = true
server_waiting_enabled = true

[status_hooks]
enabled = false

[systemd]
enabled = true
slice = "background-aoe-{profile}-{session}.slice"
survive_daemon_restart = true
tasks_max = 0

[telemetry]
enabled = false

[theme]
color_mode = "truecolor"
idle_decay_minutes = 0
name = "catppuccin-mocha-oled"

[tmux]
clipboard = "auto"
mouse = "auto"
status_bar = "auto"
vt_live = true

[tools.lazygit]
command = "lazygit"
hotkey = "Alt+g"

[updates]
auto_update_plugins = false
update_check_mode = "off"

[web]
mcp_enabled = false
notifications_enabled = true
notify_on_error = true
notify_on_idle = false
notify_on_waiting = true
notify_on_wake_fire = true

[worktree]
auto_cleanup = true
bare_repo_path_template = "./{branch}"
delete_branch_on_cleanup = false
enabled = true
init_submodules = true
path_template = "../{repo-name}-worktrees/{branch}"
workspace_by_default = false
workspace_path_template = "../{branch}-workspace-{session-id}"
